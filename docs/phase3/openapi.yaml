openapi: 3.1.0
info:
  title: AstraVoyage OTA API
  version: 1.0.0
  description: Enterprise API contract draft for the OTA platform.
servers:
  - url: https://api.astrovoyage.example.com
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Users
  - name: Travelers
  - name: Flight Search
  - name: Bookings
  - name: Payments
  - name: Tickets
  - name: Cancellations
  - name: Notifications
  - name: Admin
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Login
      responses:
        '200':
          description: Successful login
  /api/v1/flight-search/search:
    post:
      tags: [Flight Search]
      summary: Search flights
      responses:
        '200':
          description: Search results returned
  /api/v1/bookings:
    post:
      tags: [Bookings]
      summary: Create booking
      responses:
        '201':
          description: Booking created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: object
        meta:
          type: object
